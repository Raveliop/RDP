name: Build ISO
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      VSCODE_FLAVOR: code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU (for cross-arch)
        uses: docker/setup-qemu-action@v3

      - name: Install build dependencies
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then sudo dpkg --add-architecture arm64; fi
          sudo apt-get update -y
          sudo apt-get install -y \
            debootstrap qemu-user-static squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin grub-common \
            mtools dosfstools rsync imagemagick optipng
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then \
            sudo apt-get install -y grub-efi-arm64-bin:arm64; \
          fi

      - name: Generate branding assets
        run: |
          bash scripts/branding/generate_assets.sh


      - name: Bootstrap base system
        run: |
          sudo --preserve-env=ARCH,VSCODE_FLAVOR bash scripts/bootstrap.sh "$ARCH"

      - name: Customize system
        run: |
          sudo --preserve-env=ARCH,VSCODE_FLAVOR bash scripts/customize.sh "$ARCH"

      - name: Apply theme and branding
        run: |
          sudo --preserve-env=ARCH,VSCODE_FLAVOR bash scripts/theme/apply.sh

      - name: Setup Calamares
        run: |
          sudo --preserve-env=ARCH,VSCODE_FLAVOR bash scripts/installer/build_calamares.sh "$ARCH"

      - name: Build ISO
        run: |
          sudo --preserve-env=ARCH,VSCODE_FLAVOR bash scripts/iso/build_iso.sh "$ARCH"

      - name: Compute SHA256 and list artifacts
        run: |
          echo "Artifacts for $ARCH:" && ls -l out/iso/$ARCH || true

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernelos-${{ matrix.arch }}
          path: |
            out/iso/${{ matrix.arch }}/*.iso
            out/iso/${{ matrix.arch }}/*.sha256
          if-no-files-found: error

      - name: Create pre-release (branch pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: prerelease-${{ github.run_id }}-${{ matrix.arch }}
          name: "KERNELOS prerelease ${{ github.run_id }} (${{ matrix.arch }})"
          files: |
            out/iso/${{ matrix.arch }}/*.iso
            out/iso/${{ matrix.arch }}/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
